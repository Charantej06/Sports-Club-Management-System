services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: champions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: champions
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - club_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champions -d champions"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    user: root
    env_file: .env
    environment:
      DATABASE_URL: postgresql://champions:${POSTGRES_PASSWORD}@db:5432/champions
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://champions:${POSTGRES_PASSWORD}@db:5432/champions
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://champions:${POSTGRES_PASSWORD}@db:5432/champions
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  club_database:
